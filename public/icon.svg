<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1E14" />
      <stop offset="100%" stop-color="#1A0D07" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#D4AF37" stroke-width="8" stroke-opacity="0.6" />
  
  <!-- Subtle halo glow -->
  <circle cx="256" cy="210" r="170" fill="url(#halo)" />

  <!-- Golden Latin Cross with shadow -->
  <g filter="url(#shadow)">
    <!-- Vertical beam -->
    <rect x="216" y="96" width="80" height="320" rx="14" fill="url(#goldGrad)" />
    <!-- Horizontal beam -->
    <rect x="126" y="186" width="260" height="80" rx="14" fill="url(#goldGrad)" />
    
    <!-- Inner gleaming core -->
    <rect x="236" y="106" width="40" height="300" rx="8" fill="#FFFDF5" fill-opacity="0.35" />
    <rect x="136" y="206" width="240" height="40" rx="8" fill="#FFFDF5" fill-opacity="0.35" />
  </g>
</svg>
